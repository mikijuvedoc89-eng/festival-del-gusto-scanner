<!DOCTYPE html>

<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Festival del Gusto - Scanner QR</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .box {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      color: #b71c1c;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #risultato {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      word-break: break-word;
    }

    .success {
      color: #176b1d;
    }

    .error {
      color: #a00000;
    }

    .loading {
      color: #555;
    }

    .url-debug {
      margin-top: 15px;
      padding: 10px;
      background: #f1f1f1;
      border-radius: 8px;
      font-size: 11px;
      word-break: break-all;
      text-align: left;
      display: none;
    }

    button {
      margin-top: 20px;
      padding: 14px 22px;
      border: 0;
      border-radius: 10px;
      background: #b71c1c;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }
  </style>

</head>

<body>

<div class="box">

  <h1>FESTIVAL DEL GUSTO</h1>

  <h2>📷 Scansione QR Code</h2>

  <p>
    Inquadra il QR code del voucher.
  </p>

  <div id="reader"></div>

  <div id="risultato" class="loading">
    Avvio fotocamera...
  </div>

  <div id="debugUrl" class="url-debug"></div>

</div>

<script>

/* ============================================================
   PARAMETRI
   ============================================================ */

const params =
  new URLSearchParams(
    window.location.search
  );


/*
 * Questo è l'indirizzo della pagina dello stand.
 *
 * Esempio:
 *
 * https://script.google.com/macros/s/XXXXX/exec?stand=S_12345
 */

const ritorno =
  params.get("ritorno") || "";


let scanner = null;

let giaLetto = false;


/* ============================================================
   CREAZIONE URL DI RITORNO
   ============================================================ */

function creaUrlRitorno(decodedText) {

  if (!ritorno) {

    return "";

  }


  /*
   * Il parametro "ritorno" viene decodificato
   * automaticamente da URLSearchParams.
   *
   * Contiene già:
   *
   * ?stand=S_XXXXXXXX
   *
   * Perciò dobbiamo aggiungere:
   *
   * &qr=XXXXXXXX
   *
   * e NON un altro ?stand.
   */

  let url =
    ritorno;


  const separatore =
    url.indexOf("?") >= 0
      ? "&"
      : "?";


  url =
    url +
    separatore +
    "qr=" +
    encodeURIComponent(
      decodedText
    );


  return url;

}


/* ============================================================
   AVVIO SCANNER
   ============================================================ */

function avviaScanner() {

  /*
   * Controlliamo che sia presente
   * l'indirizzo di ritorno.
   */

  if (!ritorno) {

    document.getElementById(
      "risultato"
    ).innerHTML =

      "❌ ERRORE<br><br>" +

      "Manca l'indirizzo di ritorno allo stand.";

    document.getElementById(
      "risultato"
    ).className = "error";

    return;

  }


  /*
   * Creiamo lo scanner.
   */

  scanner =
    new Html5Qrcode(
      "reader"
    );


  /*
   * Avviamo la fotocamera posteriore.
   */

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },


    /*
     * QR RICONOSCIUTO
     */

    function(decodedText) {

      /*
       * Evitiamo doppie letture.
       */

      if (giaLetto) {

        return;

      }


      giaLetto = true;


      /*
       * Mostriamo il messaggio.
       */

      document.getElementById(
        "risultato"
      ).innerHTML =

        "✅ QR RICONOSCIUTO<br><br>" +

        "Ritorno allo stand...";

      document.getElementById(
        "risultato"
      ).className = "success";


      /*
       * Creiamo l'URL corretto.
       */

      const urlRitorno =
        creaUrlRitorno(
          decodedText
        );


      /*
       * Controllo di sicurezza.
       */

      if (!urlRitorno) {

        document.getElementById(
          "risultato"
        ).innerHTML =

          "❌ ERRORE<br><br>" +

          "Indirizzo di ritorno non disponibile.";

        document.getElementById(
          "risultato"
        ).className = "error";


        giaLetto = false;

        return;

      }


      /*
       * Mostriamo temporaneamente
       * l'URL che verrà aperto.
       *
       * Utile per eventuale diagnosi.
       */

      const debug =
        document.getElementById(
          "debugUrl"
        );


      debug.textContent =
        urlRitorno;


      /*
       * Dopo una breve pausa fermiamo
       * la fotocamera e torniamo
       * alla pagina dello stand.
       */

      setTimeout(

        function() {

          if (!scanner) {

            window.location.replace(
              urlRitorno
            );

            return;

          }


          scanner.stop()

            .then(

              function() {

                window.location.replace(
                  urlRitorno
                );

              }

            )

            .catch(

              function() {

                /*
                 * Anche se la fotocamera
                 * non si ferma correttamente,
                 * torniamo comunque allo stand.
                 */

                window.location.replace(
                  urlRitorno
                );

              }

            );

        },

        500

      );

    },


    /*
     * ERRORI DI SCANSIONE
     *
     * Non facciamo nulla.
     * Lo scanner continua a cercare.
     */

    function(errorMessage) {

    }

  )


  /*
   * ERRORE AVVIO FOTOCAMERA
   */

  .catch(

    function(error) {

      document.getElementById(
        "risultato"
      ).innerHTML =

        "❌ IMPOSSIBILE ACCEDERE ALLA FOTOCAMERA<br><br>" +

        "Controlla di aver autorizzato " +
        "l'accesso alla fotocamera.";

      document.getElementById(
        "risultato"
      ).className = "error";

    }

  );

}


/* ============================================================
   AVVIO PAGINA
   ============================================================ */

window.addEventListener(
  "load",
  function() {

    avviaScanner();

  }
);

</script>

</body>
</html>
