<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Festival del Gusto - Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.15);
    }

    h1 {
      margin-top: 0;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #risultato {
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      background: #eee;
      word-break: break-word;
    }

    #ritorno {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #1976d2;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Festival del Gusto</h1>

  <h2>Scanner QR</h2>

  <p>Inquadra il QR code del voucher.</p>

  <div id="reader"></div>

  <div id="risultato">
    Avvio fotocamera...
  </div>

  <a id="ritorno" href="#">
    TORNA ALLO STAND
  </a>

</div>

<script>

  // URL dello stand ricevuto dal link
  const parametri =
    new URLSearchParams(window.location.search);

  const ritorno =
    parametri.get("ritorno");

  let giaLetto = false;


  // Controllo URL
  if (!ritorno) {

    document.getElementById("risultato").innerHTML =
      "<strong>ERRORE</strong><br><br>" +
      "Manca il collegamento allo stand.";

  } else {

    avviaScanner();

  }


  function avviaScanner() {

    const scanner =
      new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },


      function(codice) {

        // Evita letture ripetute
        if (giaLetto) {
          return;
        }

        giaLetto = true;


        // =====================================
        // CREA URL DELLO STAND
        // =====================================

        const separatore =
          ritorno.indexOf("?") >= 0
            ? "&"
            : "?";


        const url =
          ritorno +
          separatore +
          "qr=" +
          encodeURIComponent(codice);


        // =====================================
        // MOSTRA RISULTATO
        // =====================================

        document.getElementById("risultato").innerHTML =
          "<strong>✅ VOUCHER RICONOSCIUTO</strong><br><br>" +
          "Codice:<br>" +
          "<strong>" +
          codice +
          "</strong><br><br>" +
          "Il voucher è stato letto correttamente.";


        // =====================================
        // CREA LINK NORMALE
        // =====================================

        const link =
          document.getElementById("ritorno");


        link.href = url;

        link.style.display = "block";


        // NON facciamo:
        // scanner.stop()
        // window.location
        // window.open
        //
        // Il browser deve semplicemente
        // mostrare il link.

      },


      function(error) {

        // Ignoriamo gli errori di scansione
      }

    ).catch(function(error) {

      document.getElementById("risultato").innerHTML =
        "<strong>ERRORE FOTOCAMERA</strong><br><br>" +
        "Impossibile accedere alla fotocamera.";

    });

  }

</script>

</body>
</html>
