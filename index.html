<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Festival del Gusto - Scanner QR</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    h2 {
      font-size: 21px;
      margin-bottom: 10px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #risultato {
      margin-top: 20px;
      padding: 18px;
      border-radius: 10px;
      background: #f1f1f1;
      font-size: 17px;
      word-break: break-word;
    }

    #pulsante {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 18px;
      font-size: 19px;
      font-weight: bold;
      border: 0;
      border-radius: 10px;
      background: #1976d2;
      color: white;
      cursor: pointer;
    }

    #pulsante:active {
      transform: scale(0.98);
    }

    #debug {
      display: none;
      margin-top: 20px;
      padding: 12px;
      background: #fff3cd;
      border-radius: 8px;
      text-align: left;
      font-size: 12px;
      word-break: break-all;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Festival del Gusto</h1>

  <h2>Scansione QR Code</h2>

  <p>Inquadra il QR code del voucher.</p>

  <div id="reader"></div>

  <div id="risultato">
    Avvio fotocamera...
  </div>

  <button id="pulsante">
    TORNA ALLO STAND
  </button>

  <div id="debug"></div>

</div>


<script>

  // ==========================================
  // PARAMETRI
  // ==========================================

  const params =
    new URLSearchParams(window.location.search);

  const ritorno =
    params.get("ritorno") || "";

  let giaLetto = false;

  let urlRitorno = "";


  // ==========================================
  // CREA URL DI RITORNO
  // ==========================================

  function creaUrlRitorno(decodedText) {

    if (!ritorno) {
      return "";
    }

    let url = ritorno;

    const separatore =
      url.indexOf("?") >= 0
        ? "&"
        : "?";

    url =
      url +
      separatore +
      "qr=" +
      encodeURIComponent(decodedText);

    return url;
  }


  // ==========================================
  // TORNA ALLO STAND
  // ==========================================

  function tornaAlloStand() {

    if (!urlRitorno) {

      alert("URL di ritorno mancante.");

      return;
    }

    document.getElementById("risultato").innerHTML =
      "<strong>Ritorno allo stand...</strong><br><br>" +
      "Attendere...";

    // Usiamo direttamente la navigazione del browser.
    window.location.href = urlRitorno;
  }


  // ==========================================
  // AVVIA SCANNER
  // ==========================================

  function avviaScanner() {

    if (!ritorno) {

      document.getElementById("risultato").innerHTML =
        "<strong>ERRORE</strong><br><br>" +
        "URL di ritorno mancante.";

      return;
    }


    const scanner =
      new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },


      function(decodedText) {

        // Evita che il QR venga letto
        // più volte consecutivamente.

        if (giaLetto) {
          return;
        }

        giaLetto = true;


        // ======================================
        // COSTRUISCE IL LINK
        // ======================================

        urlRitorno =
          creaUrlRitorno(decodedText);


        // ======================================
        // NASCONDE LO SCANNER
        // SENZA FERMARLO
        // ======================================

        document.getElementById("reader").style.display =
          "none";


        // ======================================
        // MOSTRA QR RICONOSCIUTO
        // ======================================

        document.getElementById("risultato").innerHTML =
          "<strong>✅ VOUCHER RICONOSCIUTO</strong><br><br>" +
          "Codice voucher:<br><br>" +
          "<strong>" +
          decodedText +
          "</strong><br><br>" +
          "Premi il pulsante per tornare allo stand.";


        // ======================================
        // MOSTRA PULSANTE
        // ======================================

        const pulsante =
          document.getElementById("pulsante");

        pulsante.style.display =
          "block";


        pulsante.onclick =
          tornaAlloStand;


        // ======================================
        // MOSTRA URL GENERATO
        // ======================================

        const debug =
          document.getElementById("debug");

        debug.style.display =
          "block";

        debug.innerHTML =
          "<strong>URL generato:</strong><br><br>" +
          urlRitorno;

      },


      function(errorMessage) {

        // Errori normali durante la ricerca
        // del QR: non facciamo nulla.

      }

    )

    .catch(function(error) {

      document.getElementById("risultato").innerHTML =
        "<strong>❌ ERRORE FOTOCAMERA</strong><br><br>" +
        "Controlla di aver autorizzato " +
        "l'accesso alla fotocamera.";

    });

  }


  // ==========================================
  // AVVIO
  // ==========================================

  window.onload = function() {

    avviaScanner();

  };

</script>

</body>
</html>
