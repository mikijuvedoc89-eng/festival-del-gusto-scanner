<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Festival del Gusto - Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.15);
    }

    h1 {
      margin-top: 0;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #risultato {
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      background: #eee;
      word-break: break-word;
    }

    #avvia {
      display: none;
      margin: 20px auto;
      padding: 18px 25px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #ritorno {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #1976d2;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    #indirizzo {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #f8f8f8;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 12px;
      text-align: left;
      word-break: break-all;
    }

    .errore {
      background: #ffebee !important;
      color: #b71c1c;
    }

    .ok {
      background: #e8f5e9 !important;
      color: #1b5e20;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Festival del Gusto</h1>

  <h2>Scanner QR</h2>

  <p>Inquadra il QR code del voucher.</p>

  <button id="avvia" onclick="richiediFotocamera()">
    📷 ATTIVA FOTOCAMERA
  </button>

  <div id="reader"></div>

  <div id="risultato">
    Preparazione fotocamera...
  </div>

  <div id="indirizzo"></div>

  <a id="ritorno" href="#">
    TORNA ALLO STAND
  </a>

</div>

<script>

  // =====================================================
  // PARAMETRO RITORNO
  // =====================================================

  const parametri =
    new URLSearchParams(window.location.search);

  const ritorno =
    parametri.get("ritorno");

  let scanner = null;
  let giaLetto = false;
  let fotocameraAvviata = false;


  // =====================================================
  // AVVIO
  // =====================================================

  window.addEventListener("load", function() {

    if (!ritorno) {

      mostraErrore(
        "Manca il collegamento allo stand."
      );

      return;
    }

    // Controllo browser
    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      mostraErrore(
        "Il browser non permette l'accesso alla fotocamera."
      );

      return;
    }

    // Mostriamo il pulsante.
    // Questo permette all'utente di dare
    // esplicitamente il consenso alla fotocamera.

    document.getElementById("avvia").style.display =
      "inline-block";

    document.getElementById("risultato").innerHTML =
      "Premi <strong>ATTIVA FOTOCAMERA</strong> per iniziare.";
  });


  // =====================================================
  // RICHIESTA PERMESSO FOTOCAMERA
  // =====================================================

  async function richiediFotocamera() {

    const risultato =
      document.getElementById("risultato");

    const pulsante =
      document.getElementById("avvia");

    pulsante.disabled = true;

    risultato.className = "";

    risultato.innerHTML =
      "📷 Richiesta accesso alla fotocamera...";

    try {

      const stream =
        await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: {
              ideal: "environment"
            }
          },
          audio: false
        });

      // Abbiamo ottenuto il permesso.
      // Chiudiamo immediatamente questo stream:
      // Html5Qrcode ne aprirà uno proprio.

      stream.getTracks().forEach(function(track) {
        track.stop();
      });

      fotocameraAvviata = true;

      pulsante.style.display = "none";

      risultato.innerHTML =
        "📷 Fotocamera attiva.<br>" +
        "Inquadra il QR del voucher.";

      avviaScanner();

    } catch (errore) {

      console.error(errore);

      pulsante.disabled = false;
      pulsante.style.display = "inline-block";

      let messaggio =
        "Impossibile accedere alla fotocamera.";

      if (errore && errore.name === "NotAllowedError") {

        messaggio =
          "❌ Permesso fotocamera negato.<br><br>" +
          "Consenti l'accesso alla fotocamera nelle " +
          "impostazioni del browser e riprova.";

      } else if (errore && errore.name === "NotFoundError") {

        messaggio =
          "❌ Nessuna fotocamera trovata sul dispositivo.";

      } else if (errore && errore.name === "NotReadableError") {

        messaggio =
          "❌ La fotocamera è già utilizzata da un'altra app.";

      } else if (errore && errore.name === "SecurityError") {

        messaggio =
          "❌ Il browser ha bloccato l'accesso alla fotocamera.";

      }

      risultato.className = "errore";
      risultato.innerHTML = messaggio;
    }
  }


  // =====================================================
  // AVVIO LETTORE QR
  // =====================================================

  function avviaScanner() {

    if (scanner !== null) {
      return;
    }

    scanner =
      new Html5Qrcode("reader");

    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0
      },

      function(codice) {

        if (giaLetto) {
          return;
        }

        giaLetto = true;

        // Ferma fotocamera
        if (scanner) {

          scanner.stop()
            .then(function() {

              scanner.clear();

            })
            .catch(function() {});

        }


        // =================================================
        // COSTRUZIONE URL DI RITORNO
        // =================================================

        const separatore =
          ritorno.indexOf("?") >= 0
            ? "&"
            : "?";

        const url =
          ritorno +
          separatore +
          "qr=" +
          encodeURIComponent(codice);


        // =================================================
        // RISULTATO
        // =================================================

        const risultato =
          document.getElementById("risultato");

        risultato.className = "ok";

        risultato.innerHTML =
          "<strong>✅ QR LETTO</strong><br><br>" +
          "Codice voucher:<br>" +
          "<strong>" +
          escapeHtml(codice) +
          "</strong><br><br>" +
          "Premi il pulsante per tornare allo stand.";


        // =================================================
        // MOSTRA URL
        // =================================================

        const indirizzo =
          document.getElementById("indirizzo");

        indirizzo.innerHTML =
          "<strong>Indirizzo di ritorno:</strong><br><br>" +
          escapeHtml(url);

        indirizzo.style.display = "block";


        // =================================================
        // PULSANTE RITORNO
        // =================================================

        const link =
          document.getElementById("ritorno");

        link.href = url;
        link.style.display = "block";
      },

      function(errorMessage) {
        // Errori normali mentre cerca il QR.
        // Non mostriamo nulla per evitare messaggi continui.
      }

    ).catch(function(error) {

      console.error(error);

      const risultato =
        document.getElementById("risultato");

      risultato.className = "errore";

      risultato.innerHTML =
        "<strong>❌ ERRORE FOTOCAMERA</strong><br><br>" +
        "La fotocamera non può essere avviata.<br><br>" +
        "Controlla che il browser abbia il permesso " +
        "di utilizzare la fotocamera.";

      const pulsante =
        document.getElementById("avvia");

      pulsante.disabled = false;
      pulsante.style.display = "inline-block";

    });
  }


  // =====================================================
  // ESCAPE HTML
  // =====================================================

  function escapeHtml(testo) {

    return String(testo)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // =====================================================
  // ERRORE
  // =====================================================

  function mostraErrore(testo) {

    const risultato =
      document.getElementById("risultato");

    risultato.className = "errore";

    risultato.innerHTML =
      "<strong>❌ ERRORE</strong><br><br>" +
      testo;
  }

</script>

</body>
</html>
