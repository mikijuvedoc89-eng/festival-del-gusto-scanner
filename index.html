<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Festival del Gusto - Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  text-align: center;
}

.box {
  max-width: 600px;
  margin: auto;
  padding: 20px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 3px 15px rgba(0,0,0,.15);
}

h1 {
  margin-top: 0;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: 20px auto;
}

#risultato {
  margin-top: 20px;
  padding: 20px;
  border-radius: 10px;
  background: #eee;
  word-break: break-word;
}

#ritorno {
  display: none;
  margin-top: 20px;
  padding: 18px;
  background: #1976d2;
  color: white;
  text-decoration: none;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
}

</style>

</head>

<body>

<div class="box">

<h1>Festival del Gusto</h1>

<h2>Scanner QR</h2>

<p>Inquadra il QR code del voucher.</p>

<div id="reader"></div>

<div id="risultato">
Avvio fotocamera...
</div>

<a id="ritorno" href="#">
TORNA ALLO STAND
</a>

</div>


<script>

const parametri =
  new URLSearchParams(window.location.search);

const ritorno =
  parametri.get("ritorno");

let giaLetto = false;


/* =====================================================
   CONTROLLO RITORNO
===================================================== */

if (!ritorno) {

  document.getElementById("risultato").innerHTML =
    "<strong>ERRORE</strong><br><br>" +
    "Manca il collegamento allo stand.";

} else {

  avviaScanner();

}


/* =====================================================
   SCANNER
===================================================== */

function avviaScanner() {

  const scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: {
        exact: "environment"
      }
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(codice) {

      if (giaLetto) {
        return;
      }

      giaLetto = true;


      scanner.stop()
        .catch(function() {});


      const separatore =
        ritorno.indexOf("?") >= 0
        ? "&"
        : "?";


      const url =
        ritorno +
        separatore +
        "qr=" +
        encodeURIComponent(codice);


      document.getElementById("risultato").innerHTML =

        "<strong>✅ QR LETTO</strong>" +
        "<br><br>" +

        "Codice voucher:<br>" +

        "<strong>" +
        escapeHtml(codice) +
        "</strong>" +

        "<br><br>" +

        "Premi il pulsante per tornare allo stand.";


      const link =
        document.getElementById("ritorno");


      link.href = url;

      link.style.display = "block";

    },

    function(error) {

      /* errore normale durante la ricerca del QR */

    }

  )

  .catch(function(error) {

    console.error(
      "ERRORE FOTOCAMERA:",
      error
    );


    document.getElementById("risultato").innerHTML =

      "<strong>❌ ERRORE FOTOCAMERA</strong>" +

      "<br><br>" +

      "Il browser non riesce ad avviare la fotocamera." +

      "<br><br>" +

      "<strong>ERRORE TECNICO:</strong>" +

      "<br><br>" +

      "<span style='font-size:13px'>" +

      escapeHtml(
        error &&
        error.message
          ? error.message
          : String(error)
      ) +

      "</span>";

  });

}


/* =====================================================
   SICUREZZA
===================================================== */

function escapeHtml(testo) {

  return String(testo)

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
