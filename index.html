<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Festival del Gusto - Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.15);
    }

    h1 {
      margin-top: 0;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #risultato {
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      background: #eee;
      word-break: break-word;
    }

    #avvia {
      margin: 20px auto;
      padding: 18px 25px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #ritorno {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #1976d2;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    #indirizzo {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #f8f8f8;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 12px;
      text-align: left;
      word-break: break-all;
    }

    .errore {
      background: #ffebee !important;
      color: #b71c1c;
    }

    .ok {
      background: #e8f5e9 !important;
      color: #1b5e20;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Festival del Gusto</h1>

  <h2>Scanner QR</h2>

  <p>Inquadra il QR code del voucher.</p>

  <button id="avvia" onclick="avviaScanner()">
    📷 ATTIVA FOTOCAMERA
  </button>

  <div id="reader"></div>

  <div id="risultato">
    Premi il pulsante per attivare la fotocamera.
  </div>

  <div id="indirizzo"></div>

  <a id="ritorno" href="#">
    TORNA ALLO STAND
  </a>

</div>

<script>

const parametri =
  new URLSearchParams(window.location.search);

const ritorno =
  parametri.get("ritorno");

let scanner = null;
let giaLetto = false;


/* =====================================================
   CONTROLLO RITORNO
===================================================== */

if (!ritorno) {

  document.getElementById("avvia").style.display = "none";

  mostraErrore(
    "Manca il collegamento allo stand."
  );
}


/* =====================================================
   AVVIA SCANNER
===================================================== */

function avviaScanner() {

  if (!ritorno) {
    return;
  }

  if (scanner !== null) {
    return;
  }

  const risultato =
    document.getElementById("risultato");

  const pulsante =
    document.getElementById("avvia");

  pulsante.disabled = true;

  risultato.className = "";

  risultato.innerHTML =
    "📷 Apertura fotocamera...";

  scanner =
    new Html5Qrcode("reader");


  /* ===================================================
     AVVIO DIRETTO DELLA FOTOCAMERA
  =================================================== */

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0
    },


    /* ================================================
       QR TROVATO
    ================================================ */

    function(codice) {

      if (giaLetto) {
        return;
      }

      giaLetto = true;

      scanner.stop()
        .then(function() {

          scanner.clear();

        })
        .catch(function() {});


      /* ==============================================
         CREA URL RITORNO
      ============================================== */

      const separatore =
        ritorno.indexOf("?") >= 0
          ? "&"
          : "?";

      const url =
        ritorno +
        separatore +
        "qr=" +
        encodeURIComponent(codice);


      /* ==============================================
         RISULTATO
      ============================================== */

      risultato.className = "ok";

      risultato.innerHTML =
        "<strong>✅ QR LETTO</strong><br><br>" +
        "Codice voucher:<br>" +
        "<strong>" +
        escapeHtml(codice) +
        "</strong><br><br>" +
        "Premi il pulsante per tornare allo stand.";


      /* ==============================================
         MOSTRA URL
      ============================================== */

      const indirizzo =
        document.getElementById("indirizzo");

      indirizzo.innerHTML =
        "<strong>Indirizzo di ritorno:</strong><br><br>" +
        escapeHtml(url);

      indirizzo.style.display = "block";


      /* ==============================================
         PULSANTE RITORNO
      ============================================== */

      const link =
        document.getElementById("ritorno");

      link.href = url;

      link.style.display = "block";

      pulsante.style.display = "none";

    },


    /* ================================================
       ERRORI NORMALI DI SCANSIONE
    ================================================ */

    function(errorMessage) {

      // Non facciamo nulla.
      // Questi errori sono normali mentre
      // la fotocamera sta cercando un QR.

    }

  )

  .then(function() {

    risultato.className = "ok";

    risultato.innerHTML =
      "📷 <strong>FOTOCAMERA ATTIVA</strong><br><br>" +
      "Inquadra il QR del voucher.";

  })

  .catch(function(error) {

    console.error(error);

    scanner = null;

    pulsante.disabled = false;

    risultato.className = "errore";

    risultato.innerHTML =
      "<strong>❌ ACCESSO FOTOCAMERA NEGATO</strong><br><br>" +
      "Il browser non ha concesso l'accesso alla fotocamera.<br><br>" +
      "Controlla il permesso della fotocamera per questo sito e riprova.";

  });

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(testo) {

  return String(testo)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   ERRORE
===================================================== */

function mostraErrore(testo) {

  const risultato =
    document.getElementById("risultato");

  risultato.className = "errore";

  risultato.innerHTML =
    "<strong>❌ ERRORE</strong><br><br>" +
    testo;

}

</script>

</body>
</html>
