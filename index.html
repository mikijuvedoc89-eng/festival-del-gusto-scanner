<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Festival del Gusto - Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.15);
    }

    h1 {
      margin-top: 0;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #risultato {
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      background: #eee;
      word-break: break-word;
    }

    #ritorno {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #1976d2;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    #indirizzo {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #f8f8f8;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 12px;
      text-align: left;
      word-break: break-all;
    }

  </style>

</head>

<body>

<div class="box">

  <h1>Festival del Gusto</h1>

  <h2>Scanner QR</h2>

  <p>Inquadra il QR code del voucher.</p>

  <div id="reader"></div>

  <div id="risultato">
    Avvio fotocamera...
  </div>

  <div id="indirizzo"></div>

  <a id="ritorno" href="#">
    TORNA ALLO STAND
  </a>

</div>


<script>


/* =====================================================
   PARAMETRI URL
===================================================== */

const parametri =
  new URLSearchParams(window.location.search);


const ritorno =
  parametri.get("ritorno");


let giaLetto = false;


/* =====================================================
   CONTROLLO COLLEGAMENTO STAND
===================================================== */

if (!ritorno) {

  document.getElementById("risultato").innerHTML =

    "<strong>❌ ERRORE</strong>" +

    "<br><br>" +

    "Manca il collegamento allo stand.";

} else {

  avviaScanner();

}


/* =====================================================
   AVVIO SCANNER
===================================================== */

function avviaScanner() {

  const scanner =
    new Html5Qrcode("reader");


  scanner.start(

    /* =================================================
       FOTOCAMERA
       NON USIAMO exact
    ================================================= */

    {
      facingMode: "environment"
    },


    /* =================================================
       CONFIGURAZIONE QR
    ================================================= */

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },


    /* =================================================
       QR LETTO
    ================================================= */

    function(codice) {

      if (giaLetto) {
        return;
      }


      giaLetto = true;


      /* ===============================================
         FERMA SCANNER
      =============================================== */

      scanner.stop()
        .catch(function() {});


      /* ===============================================
         CREA URL RITORNO
      =============================================== */

      const separatore =

        ritorno.indexOf("?") >= 0
          ? "&"
          : "?";


      const url =

        ritorno +
        separatore +
        "qr=" +
        encodeURIComponent(codice);


      /* ===============================================
         MOSTRA RISULTATO
      =============================================== */

      document.getElementById("risultato").innerHTML =

        "<strong>✅ QR LETTO</strong>" +

        "<br><br>" +

        "Codice voucher:<br>" +

        "<strong>" +
        escapeHtml(codice) +
        "</strong>" +

        "<br><br>" +

        "Premi il pulsante per tornare allo stand.";


      /* ===============================================
         MOSTRA URL
      =============================================== */

      const indirizzo =
        document.getElementById("indirizzo");


      indirizzo.innerHTML =

        "<strong>Indirizzo di ritorno:</strong>" +

        "<br><br>" +

        escapeHtml(url);


      indirizzo.style.display =
        "block";


      /* ===============================================
         PULSANTE TORNA ALLO STAND
      =============================================== */

      const link =
        document.getElementById("ritorno");


      link.href =
        url;


      link.style.display =
        "block";

    },


    /* =================================================
       ERRORI DURANTE LA RICERCA DEL QR
    ================================================= */

    function(error) {

      /*
       * Non mostriamo nulla.
       *
       * Durante la ricerca del QR
       * html5-qrcode genera continuamente
       * piccoli errori normali.
       */

    }

  )


  /* ===================================================
     ERRORE AVVIO FOTOCAMERA
  =================================================== */

  .catch(function(error) {

    console.error(
      "ERRORE FOTOCAMERA:",
      error
    );


    let messaggio = "";

    if (error && error.message) {

      messaggio =
        error.message;

    } else {

      messaggio =
        String(error);

    }


    document.getElementById("risultato").innerHTML =

      "<strong>❌ ERRORE FOTOCAMERA</strong>" +

      "<br><br>" +

      "Il browser non riesce ad avviare la fotocamera." +

      "<br><br>" +

      "<strong>ERRORE TECNICO:</strong>" +

      "<br><br>" +

      "<span style='font-size:13px'>" +

      escapeHtml(messaggio) +

      "</span>";

  });

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(testo) {

  return String(testo)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
