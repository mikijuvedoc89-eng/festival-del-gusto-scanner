<!DOCTYPE html>

<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Festival del Gusto - Scanner QR</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #risultato {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      word-break: break-word;
    }

    button {
      margin-top: 20px;
      padding: 14px 22px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }
  </style>

</head>

<body>

  <div class="box">

```
<h1>Festival del Gusto</h1>

<h2>Scansione QR Code</h2>

<p>
  Inquadra il QR code del voucher.
</p>

<div id="reader"></div>

<div id="risultato"></div>
```

  </div>

<script>

  /*
   * Recuperiamo il parametro "ritorno"
   * passato dalla pagina dello stand.
   *
   * Esempio:
   * https://script.google.com/.../exec?stand=S_12345
   */

  const params = new URLSearchParams(window.location.search);

  const ritorno = params.get("ritorno") || "";

  let scanner = null;
  let giaLetto = false;


  /*
   * Costruisce correttamente l'URL di ritorno.
   *
   * IMPORTANTE:
   * ritorno contiene già ?stand=...
   * quindi NON dobbiamo aggiungere un altro ?stand.
   */

  function creaUrlRitorno(decodedText) {

    if (!ritorno) {
      return "";
    }

    let url = ritorno;

    /*
     * Se l'URL contiene già "?"
     * aggiungiamo "&qr=".
     *
     * Altrimenti aggiungiamo "?qr=".
     */

    const separatore =
      url.indexOf("?") >= 0
        ? "&"
        : "?";

    url =
      url +
      separatore +
      "qr=" +
      encodeURIComponent(decodedText);

    return url;
  }


  /*
   * Avvio scanner
   */

  function avviaScanner() {

    scanner =
      new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },


      function(decodedText) {

        /*
         * Evita che lo stesso QR venga
         * elaborato più volte.
         */

        if (giaLetto) {
          return;
        }

        giaLetto = true;


        document.getElementById("risultato").innerHTML =
          "✅ QR riconosciuto.<br><br>" +
          "Ritorno allo stand...";


        /*
         * Creiamo subito l'URL corretto.
         */

        const urlRitorno =
          creaUrlRitorno(decodedText);


        /*
         * Se non abbiamo un URL di ritorno,
         * mostriamo l'errore.
         */

        if (!urlRitorno) {

          document.getElementById("risultato").innerHTML =
            "❌ Errore: manca il collegamento di ritorno allo stand.";

          giaLetto = false;

          return;
        }


        /*
         * Fermiamo la fotocamera prima
         * di tornare alla pagina dello stand.
         */

        scanner.stop()

          .then(function() {

            window.location.href =
              urlRitorno;

          })

          .catch(function() {

            /*
             * Anche se la fotocamera non si
             * ferma correttamente, torniamo
             * comunque allo stand.
             */

            window.location.href =
              urlRitorno;

          });

      },


      function(errorMessage) {

        /*
         * Nessun errore da mostrare:
         * lo scanner continua a cercare il QR.
         */

      }

    )

    .catch(function(error) {

      giaLetto = false;

      document.getElementById("risultato").innerHTML =
        "❌ Impossibile accedere alla fotocamera.<br><br>" +
        "Controlla di aver consentito l'accesso alla fotocamera.";

    });

  }


  /*
   * Avvio automatico
   */

  window.onload = function() {

    avviaScanner();

  };

</script>

</body>
</html>
