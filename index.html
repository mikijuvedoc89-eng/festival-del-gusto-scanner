<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Festival del Gusto - Scanner QR</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    h2 {
      font-size: 21px;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #risultato {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f1f1;
      font-size: 16px;
      word-break: break-word;
    }

    #debug {
      margin-top: 15px;
      padding: 10px;
      background: #fff3cd;
      border: 1px solid #ffe69c;
      border-radius: 8px;
      font-size: 13px;
      word-break: break-all;
      display: none;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Festival del Gusto</h1>

  <h2>Scansione QR Code</h2>

  <p>
    Inquadra il QR code del voucher.
  </p>

  <div id="reader"></div>

  <div id="risultato">
    Avvio fotocamera...
  </div>

  <div id="debug"></div>

</div>

<script>

  // ==========================================
  // PARAMETRI RICEVUTI
  // ==========================================

  const params = new URLSearchParams(window.location.search);

  const ritorno = params.get("ritorno") || "";

  let scanner = null;
  let giaLetto = false;


  // ==========================================
  // CREA URL DI RITORNO
  // ==========================================

  function creaUrlRitorno(decodedText) {

    if (!ritorno) {
      return "";
    }

    let url = ritorno;

    const separatore = url.indexOf("?") >= 0 ? "&" : "?";

    url =
      url +
      separatore +
      "qr=" +
      encodeURIComponent(decodedText);

    return url;
  }


  // ==========================================
  // AVVIA SCANNER
  // ==========================================

  function avviaScanner() {

    if (!ritorno) {

      document.getElementById("risultato").innerHTML =
        "<strong>Errore</strong><br><br>" +
        "URL di ritorno mancante.";

      return;
    }


    scanner = new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },


      function(decodedText) {

        // Evita letture multiple dello stesso QR
        if (giaLetto) {
          return;
        }

        giaLetto = true;


        // Costruiamo URL di ritorno
        const urlRitorno =
          creaUrlRitorno(decodedText);


        // Mostriamo il risultato
        document.getElementById("risultato").innerHTML =
          "<strong>QR RICONOSCIUTO</strong><br><br>" +
          "Ritorno allo stand...";


        // Mostra temporaneamente l'URL
        const debug =
          document.getElementById("debug");

        debug.style.display = "block";

        debug.innerHTML =
          "<strong>URL DI RITORNO:</strong><br><br>" +
          urlRitorno;


        // ======================================
        // TEST IMPORTANTE
        // ======================================

        // Mostra l'URL in una finestra.
        // Questo ci permette di controllare
        // esattamente dove sta tentando di tornare.

        alert(
          "URL DI RITORNO:\n\n" +
          urlRitorno
        );


        // ======================================
        // TORNA ALLO STAND
        // ======================================

        setTimeout(function() {

          if (scanner) {

            scanner.stop()

              .then(function() {

                window.location.replace(
                  urlRitorno
                );

              })

              .catch(function() {

                window.location.replace(
                  urlRitorno
                );

              });

          } else {

            window.location.replace(
              urlRitorno
            );

          }

        }, 500);

      },


      function(errorMessage) {

        // Errori di scansione normali:
        // non facciamo nulla.
      }

    )

    .catch(function(error) {

      document.getElementById("risultato").innerHTML =
        "<strong>Impossibile accedere alla fotocamera.</strong><br><br>" +
        "Controlla di aver consentito l'accesso alla fotocamera.<br><br>" +
        error;

    });

  }


  // ==========================================
  // AVVIO AUTOMATICO
  // ==========================================

  window.onload = function() {

    avviaScanner();

  };

</script>

</body>
</html>
