<!DOCTYPE html>

<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Festival del Gusto - Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.15);
    }

    h1 {
      margin-top: 0;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #risultato {
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      background: #eee;
      word-break: break-word;
    }

    #ritorno {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #1976d2;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>

</head>

<body>

<div class="box">

  <h1>Festival del Gusto</h1>

  <h2>Scanner QR</h2>

  <p>Inquadra il QR code del voucher.</p>

  <div id="reader"></div>

  <div id="risultato">
    Avvio fotocamera...
  </div>

  <a id="ritorno" href="#">
    TORNA ALLO STAND
  </a>

</div>

<script>

  // =====================================================
  // LEGGE L'URL DI RITORNO PASSATO DALLO STAND
  // =====================================================

  const parametri =
    new URLSearchParams(window.location.search);

  const ritorno =
    parametri.get("ritorno");

  let giaLetto = false;


  // =====================================================
  // CONTROLLO URL
  // =====================================================

  if (!ritorno) {

    document.getElementById("risultato").innerHTML =
      "<strong>ERRORE</strong><br><br>" +
      "Manca il collegamento allo stand.";

  } else {

    avviaScanner();

  }


  // =====================================================
  // AVVIO SCANNER
  // =====================================================

  function avviaScanner() {

    const scanner =
      new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },


      // =================================================
      // QR LETTO
      // =================================================

      function(codice) {

        // Evita letture multiple
        if (giaLetto) {
          return;
        }

        giaLetto = true;


        // ===============================================
        // FERMA LA FOTOCAMERA
        // ===============================================

        scanner.stop()
          .catch(function() {
            // Se non riesce a fermarla,
            // procediamo comunque.
          });


        // ===============================================
        // CREA IL LINK DI RITORNO
        //
        // "ritorno" contiene già:
        //
        // https://script.google.com/.../exec?stand=S_xxxxx
        //
        // quindi dobbiamo aggiungere &qr=
        // ===============================================

        let separatore;

        if (ritorno.indexOf("?") >= 0) {
          separatore = "&";
        } else {
          separatore = "?";
        }


        const url =
          ritorno +
          separatore +
          "qr=" +
          encodeURIComponent(codice);


        // ===============================================
        // MOSTRA IL CODICE LETTO
        // ===============================================

        document.getElementById("risultato").innerHTML =
          "<strong>✅ VOUCHER LETTO</strong><br><br>" +
          "Codice:<br>" +
          "<strong>" +
          escapeHtml(codice) +
          "</strong><br><br>" +
          "Ritorno allo stand...";


        // ===============================================
        // PREPARA IL PULSANTE
        // ===============================================

        const link =
          document.getElementById("ritorno");

        link.href = url;

        link.style.display = "block";


        // ===============================================
        // TORNA AUTOMATICAMENTE ALLO STAND
        //
        // Piccolo ritardo per permettere al browser
        // di completare la lettura del QR.
        // ===============================================

        setTimeout(function() {

          window.location.href = url;

        }, 500);

      },


      // =================================================
      // ERRORI DI LETTURA
      // =================================================

      function(error) {

        // Ignoriamo gli errori normali
        // mentre la fotocamera sta cercando il QR.

      }

    ).catch(function(error) {

      document.getElementById("risultato").innerHTML =
        "<strong>ERRORE FOTOCAMERA</strong><br><br>" +
        "Impossibile accedere alla fotocamera.<br><br>" +
        "Controlla di aver autorizzato il browser " +
        "ad utilizzare la fotocamera.";

    });

  }


  // =====================================================
  // SICUREZZA: MOSTRA IL CODICE COME TESTO
  // =====================================================

  function escapeHtml(testo) {

    return String(testo)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

</script>

</body>
</html>
