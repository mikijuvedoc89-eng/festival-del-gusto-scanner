<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Festival del Gusto - Scanner QR</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
      text-align: center;
    }

    .box {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    h2 {
      font-size: 21px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
    }

    #risultato {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f1f1;
      font-size: 16px;
      word-break: break-word;
    }

    #pulsante {
      display: none;
      margin-top: 20px;
      padding: 15px 25px;
      font-size: 18px;
      font-weight: bold;
      border: 0;
      border-radius: 10px;
      background: #1976d2;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Festival del Gusto</h1>

  <h2>Scansione QR Code</h2>

  <p>Inquadra il QR code del voucher.</p>

  <div id="reader"></div>

  <div id="risultato">
    Avvio fotocamera...
  </div>

  <button id="pulsante">
    TORNA ALLO STAND
  </button>

</div>


<script>

  // ==========================================
  // PARAMETRI
  // ==========================================

  const params =
    new URLSearchParams(window.location.search);

  const ritorno =
    params.get("ritorno") || "";

  let scanner = null;

  let giaLetto = false;

  let urlRitorno = "";


  // ==========================================
  // CREA URL
  // ==========================================

  function creaUrlRitorno(decodedText) {

    if (!ritorno) {
      return "";
    }

    const separatore =
      ritorno.indexOf("?") >= 0
        ? "&"
        : "?";

    return (
      ritorno +
      separatore +
      "qr=" +
      encodeURIComponent(decodedText)
    );
  }


  // ==========================================
  // TORNA ALLO STAND
  // ==========================================

  function tornaAlloStand() {

    if (!urlRitorno) {
      return;
    }

    document.getElementById("risultato").innerHTML =
      "<strong>APERTURA STAND...</strong><br><br>" +
      "Attendere...";

    window.open(
      urlRitorno,
      "_self"
    );
  }


  // ==========================================
  // SCANSIONE
  // ==========================================

  function avviaScanner() {

    if (!ritorno) {

      document.getElementById("risultato").innerHTML =
        "<strong>ERRORE</strong><br><br>" +
        "Manca l'indirizzo di ritorno.";

      return;
    }


    scanner =
      new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },


      function(decodedText) {

        if (giaLetto) {
          return;
        }

        giaLetto = true;


        // Costruisce il link
        urlRitorno =
          creaUrlRitorno(decodedText);


        // Mostra QR riconosciuto
        document.getElementById("risultato").innerHTML =
          "<strong>QR RICONOSCIUTO</strong><br><br>" +
          "Voucher: " +
          decodedText;


        // Mostra pulsante
        const pulsante =
          document.getElementById("pulsante");

        pulsante.style.display =
          "inline-block";


        pulsante.onclick =
          tornaAlloStand;


        // Prova a fermare la fotocamera
        if (scanner) {

          scanner.stop().catch(function() {});

        }


        // Dopo 1 secondo torna automaticamente
        setTimeout(function() {

          tornaAlloStand();

        }, 1000);

      },


      function(errorMessage) {

        // Normali errori durante la ricerca QR.
      }

    )

    .catch(function(error) {

      document.getElementById("risultato").innerHTML =
        "<strong>ERRORE FOTOCAMERA</strong><br><br>" +
        "Controlla di aver autorizzato " +
        "l'accesso alla fotocamera.<br><br>" +
        error;

    });

  }


  // ==========================================
  // AVVIO
  // ==========================================

  window.onload = function() {

    avviaScanner();

  };

</script>

</body>
</html>
